<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="ماژول‌های یکپارچه ERP، برنامه‌های دسکتاپ و افزونه‌ها برای کسب‌وکارهای متوسط." />
  <title>فروغ آریا پارسیان — مجموعه نرم‌افزار کسب‌وکار</title>
  <base href="/" />
  <!-- پیش‌بارگیریِ فونت: چرا مهم است؟
       فونتِ فارسی بعد از نخستین رنگ‌آمیزی می‌رسید و جایگزینِ قلمِ پیش‌فرض
       می‌شد؛ متن دوباره می‌چید و کلِ صفحه می‌پرید (جابه‌جاییِ چیدمانِ حدود
       ۰/۰۹). با پیش‌بارگیری، فونت هم‌زمان با سی‌اس‌اس می‌آید و دیگر تعویضی
       در کار نیست. فقط وزن‌هایی که بالایِ خطِ دید استفاده می‌شوند. -->
  <link rel="preload" href="fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/Vazirmatn-Medium.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/Vazirmatn-ExtraBold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/utilities.css" />
  <link rel="stylesheet" href="css/ecosystem.css" />
  <link rel="stylesheet" href="css/hero-orbit.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
  <div id="app">
    <!-- Boot screen: replaced by Blazor as soon as the runtime is ready -->
    <div class="boot">
      <div class="boot__mark" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <div class="boot__label">فروغ آریا پارسیان</div>
      <div class="boot__bar"><i></i></div>
      <div class="boot__hint">در حال آماده‌سازی فروشگاه…</div>
    </div>
  </div>

  <div id="blazor-error-ui" role="alert">
    <div class="err-card">
      <strong>خطای پیش‌بینی‌نشده</strong>
      <span>برای ادامه، صفحه را دوباره بارگیری کنید.</span>
      <a href="." class="reload">بارگیری مجدد</a>
    </div>
    <span class="dismiss" aria-hidden="true">✕</span>
  </div>

  <script src="js/app.js"></script>
  <script>
    /* اعمالِ تم پیش از بارگیریِ WASM تا چشمکِ پس‌زمینه دیده نشود */
    (function () {
      try {
        var t = localStorage.getItem("nw-theme");
        if (t !== "dark" && t !== "light") {
          t = "light";   /* پیش‌فرضِ سایت روشن است (پس‌زمینهٔ سفید).
                            تا وقتی کاربر خودش انتخاب نکرده، از تنظیمِ
                            سیستم‌عامل پیروی نمی‌کنیم؛ حالتِ تاریک با
                            دکمهٔ تغییرِ تم در دسترس است و انتخاب در
                            حافظهٔ مرورگر می‌ماند. */
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { }
    })();
  </script>
  <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
